name: Build DropSystem OS ISO

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      options: --privileged

    steps:
      - name: Instalar dependências
        run: |
          apt-get update
          apt-get install -y live-build build-essential squashfs-tools xorriso git wget ca-certificates

      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar live-build
        run: ./auto/config

      - name: Compilar a ISO
        run: ./auto/build

      - name: Gerar checksum SHA256
        run: sha256sum -- *.iso > SHA256SUMS

      - name: Criar Release e anexar ISO
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.iso
            SHA256SUMS
